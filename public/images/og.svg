<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid lines -->
  <g opacity="0.05" stroke="#a855f7" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Border -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Corner accents -->
  <line x1="24" y1="24" x2="80" y2="24" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="24" y2="80" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <line x1="1176" y1="606" x2="1120" y2="606" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
  <line x1="1176" y1="606" x2="1176" y2="550" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>

  <!-- Glitch layers for title -->
  <text x="100" y="310" font-family="system-ui, sans-serif" font-weight="900" font-size="130" fill="#ff0040" opacity="0.3" dx="-3" dy="2">shiv.rocks</text>
  <text x="100" y="310" font-family="system-ui, sans-serif" font-weight="900" font-size="130" fill="#00c8ff" opacity="0.2" dx="3" dy="-2">shiv.rocks</text>

  <!-- Main title -->
  <text x="100" y="310" font-family="system-ui, sans-serif" font-weight="900" font-size="130" fill="url(#grad)">shiv.rocks</text>

  <!-- Tagline -->
  <text x="100" y="380" font-family="system-ui, sans-serif" font-size="28" fill="#a0a0b0" letter-spacing="8">BESPOKE SOFTWARE STUDIO</text>

  <!-- Slogan -->
  <text x="100" y="440" font-family="monospace" font-size="18" fill="#606070" letter-spacing="4">ENGINEERING TOMORROW, TODAY</text>

  <!-- Dot accent -->
  <circle cx="1120" cy="200" r="60" fill="#a855f7" opacity="0.08"/>
  <circle cx="1120" cy="200" r="40" fill="#a855f7" opacity="0.08"/>
  <circle cx="1120" cy="200" r="20" fill="#a855f7" opacity="0.15"/>
</svg>
