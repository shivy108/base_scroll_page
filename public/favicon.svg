<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0a0a0f"/>

  <!-- Subtle grid lines -->
  <g clip-path="url(#clip)" opacity="0.08">
    <line x1="0" y1="16" x2="64" y2="16" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="0" y1="32" x2="64" y2="32" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="0" y1="48" x2="64" y2="48" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="16" y1="0" x2="16" y2="64" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="32" y1="0" x2="32" y2="64" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="48" y1="0" x2="48" y2="64" stroke="#a855f7" stroke-width="0.5"/>
  </g>

  <!-- Glitch layer red offset -->
  <text x="10" y="46" font-family="system-ui, sans-serif" font-weight="900" font-size="38" fill="#ff0040" opacity="0.4" clip-path="url(#clip)">S</text>

  <!-- Glitch layer cyan offset -->
  <text x="14" y="44" font-family="system-ui, sans-serif" font-weight="900" font-size="38" fill="#00c8ff" opacity="0.3" clip-path="url(#clip)">S</text>

  <!-- Main S with gradient -->
  <text x="12" y="45" font-family="system-ui, sans-serif" font-weight="900" font-size="38" fill="url(#g)" clip-path="url(#clip)">S</text>

  <!-- Dot -->
  <circle cx="50" cy="44" r="5" fill="url(#g2)"/>

  <!-- Corner accent lines -->
  <line x1="2" y1="2" x2="10" y2="2" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="2" y1="2" x2="2" y2="10" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="62" y1="62" x2="54" y2="62" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="62" y1="62" x2="62" y2="54" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
